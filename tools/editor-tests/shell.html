<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>fframes Editor</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#fff}#players{height:100dvh;height:var(--height,100dvh);width:100%}iframe{border:0;width:100%;height:100%;display:block}iframe[hidden]{display:block;position:absolute;inset:0;visibility:hidden;pointer-events:none}#loading{position:fixed;inset:0;z-index:10;background:#fff9;display:grid;place-items:center;padding:24px}#loading[hidden]{display:none}.card{background:white;border:1px solid #ddd;border-radius:20px;box-shadow:0 8px 32px #0002;padding:24px;max-width:360px;text-align:center}button{font:inherit;padding:10px 18px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer;margin:8px 4px 0}#retry{background:#ff6922;color:white;border-color:#ff6922}p{color:#59616b;font-size:14px;line-height:1.5}h1{font-size:18px;margin:0}

#testbar{height:48px;display:flex;align-items:center;gap:8px;padding:4px 8px;background:#10151e;color:white;overflow:auto;white-space:nowrap;font-size:12px}#testbar button{margin:0;padding:6px 10px;min-height:36px;font-size:12px}#testbar select{height:36px;max-width:160px}#stage{position:relative;width:100%;height:calc(var(--height,100dvh) - 48px);overflow:hidden;background:#293444}#players{position:absolute;top:0;left:50%;transform-origin:top center;background:white}#testbar [hidden]{display:none}
</style></head><body><nav id="testbar" aria-label="Layout size testing"><button id="testtoggle">Size test</button><select id="testsize" aria-label="Test viewport size" hidden><option value="0">Narrow · 240 × 640</option><option value="1">Phone · 360 × 740</option><option value="2">Landscape · 932 × 430</option><option value="3">Short · 1200 × 280</option><option value="4">Tablet · 768 × 1024</option><option value="5">Wide · 1600 × 900</option></select><button id="testcycle" hidden>Animate sizes</button><button id="runtests">Run module tests</button><button id="downloadtests" hidden>Download report</button><span id="teststatus" role="status"></span></nav><div id="stage"><main id="players" aria-label="Animation editor"></main></div><div id="loading" role="status" aria-live="polite"><div class="card"><h1 id="status">Loading editor…</h1><p id="detail">Preparing the example and its media.</p><button id="retry" hidden>Try again</button><button id="cancel" hidden>Keep current example</button></div></div><script type="module">
import {installTests} from "/module-tests.js";
const routes=new Map([
 ['/',{name:'Hello World',src:'/players/hello-world/'}],
 ['/examples/motion-graphics/',{name:'Motion Graphics',src:'/players/motion-graphics/'}],
 ['/examples/beta/',{name:'Beta Showcase',src:'/players/beta/'}]
]);
const host=document.querySelector('#players'), overlay=document.querySelector('#loading'), status=document.querySelector('#status'), detail=document.querySelector('#detail'), retry=document.querySelector('#retry'), cancel=document.querySelector('#cancel');
const cache=new Map();let active=null,pending=null,clock=0;
const route=()=>{const p=location.pathname.replace(/\/?$/,'/');return routes.has(p)?p:'/'};
function pause(entry){entry?.frame.contentWindow?.postMessage({type:'fframes-pause'},location.origin)}
function prune(){for(const entry of [...cache.values()].sort((a,b)=>a.used-b.used)){if(cache.size<=2)break;if(entry!==active&&entry.path!==pending?.path){entry.frame.remove();cache.delete(entry.path)}}}
function activate(entry){const push=pending?.push;pause(active);for(const item of cache.values())item.frame.hidden=item!==entry;active=entry;entry.used=++clock;pending=null;overlay.hidden=true;host.inert=false;if(push&&location.pathname!==entry.path)history.pushState({},'',entry.path);document.title=`${routes.get(entry.path).name} · fframes`;prune()}
function show(path,push=true){if(!routes.has(path))return;pending={path,push};pause(active);let entry=cache.get(path);if(entry?.ready){activate(entry);return}overlay.hidden=false;host.inert=true;status.textContent=`Loading ${routes.get(path).name}…`;detail.textContent='Preparing the example and its media. Recent examples stay ready to revisit.';retry.hidden=true;cancel.hidden=!active;if(!entry){const frame=document.createElement('iframe');frame.title=routes.get(path).name;frame.allow='autoplay; fullscreen';frame.hidden=true;entry={path,frame,ready:false,used:++clock};cache.set(path,entry);frame.src=routes.get(path).src;host.append(frame);prune()}}
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const entry=[...cache.values()].find(item=>item.frame.contentWindow===event.source);if(!entry)return;const data=event.data;if(data?.type==='fframes-switch'&&entry===active&&routes.has(data.path))show(data.path);if(data?.type==='fframes-ready'){entry.ready=true;if(pending?.path===entry.path)activate(entry)}if(data?.type==='fframes-error'&&pending?.path===entry.path){status.textContent='This example could not load';detail.textContent='Try loading it again. Your current example is still available.';retry.hidden=false}});
retry.onclick=()=>{if(!pending)return;const {path,push}=pending;const entry=cache.get(path);entry?.frame.remove();cache.delete(path);show(path,push)};
cancel.onclick=()=>{if(!active)return;pending=null;overlay.hidden=true;host.inert=false;history.replaceState({},'',active.path);prune()};
window.addEventListener('popstate',()=>show(route(),false));
const resize=()=>document.documentElement.style.setProperty('--height',`${window.visualViewport?.height??window.innerHeight}px`);window.visualViewport?.addEventListener('resize',resize);window.addEventListener('resize',resize);resize();show(route(),false);
const toggle=document.querySelector('#testtoggle'),sizes=document.querySelector('#testsize'),cycle=document.querySelector('#testcycle'),readout=document.querySelector('#teststatus');
const presets=[[240,640],[360,740],[932,430],[1200,280],[768,1024],[1600,900]];
let testing=false,cycling=false,timer=0,animation=0,current=[innerWidth,innerHeight-48];
function applySize(w,h){current=[w,h];const availableWidth=window.visualViewport?.width??innerWidth,availableHeight=Math.max(1,(window.visualViewport?.height??innerHeight)-48);const scale=testing?Math.min(1,availableWidth/w,availableHeight/h):1;host.style.width=`${w}px`;host.style.height=`${h}px`;host.style.transform=`translateX(-50%) scale(${scale})`;readout.textContent=testing?`${Math.round(w)} × ${Math.round(h)} · ${Math.round(scale*100)}% view`:''}
function fit(){cancelAnimationFrame(animation);const [w,h]=testing?presets[Number(sizes.value)]:[window.visualViewport?.width??innerWidth,Math.max(1,(window.visualViewport?.height??innerHeight)-48)];applySize(w,h)}
function change(){cancelAnimationFrame(animation);const target=presets[Number(sizes.value)],from=[...current],start=performance.now();if(matchMedia('(prefers-reduced-motion: reduce)').matches){fit();return}function tick(now){const t=Math.min(1,(now-start)/1400),e=t*t*(3-2*t);applySize(from[0]+(target[0]-from[0])*e,from[1]+(target[1]-from[1])*e);if(t<1)animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)}
function stop(){cycling=false;clearInterval(timer);cycle.textContent='Animate sizes'}
toggle.onclick=()=>{testing=!testing;stop();sizes.hidden=cycle.hidden=!testing;toggle.textContent=testing?'Done':'Size test';fit()};sizes.onchange=change;cycle.onclick=()=>{if(cycling){stop();return}cycling=true;cycle.textContent='Stop animation';timer=setInterval(()=>{sizes.value=String((Number(sizes.value)+1)%presets.length);change()},3500);change()};window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);fit();

const runButton=document.querySelector('#runtests'),downloadButton=document.querySelector('#downloadtests');let testRunning=false;
window.fframesTests=installTests({host,routes,presets,show,getActive:()=>active,applySize,setTesting:value=>{stop();cancelAnimationFrame(animation);testing=value;toggle.disabled=sizes.disabled=cycle.disabled=value},restore:()=>{sizes.hidden=cycle.hidden=true;toggle.textContent='Size test';fit()}});
runButton.onclick=async()=>{if(testRunning){window.fframesTests.cancel();return}testRunning=true;runButton.textContent='Cancel tests';downloadButton.hidden=true;try{const report=await window.fframesTests.run();const checks=report.results.flatMap(r=>r.checks),failed=checks.filter(c=>c.status==='fail').length,skipped=checks.filter(c=>c.status==='skipped').length;readout.textContent=`${report.complete?'Finished':'Incomplete'}: ${failed} failures, ${skipped} skipped`;downloadButton.hidden=false;}catch(error){readout.textContent=error.message}finally{testRunning=false;runButton.textContent='Run module tests'}};
window.addEventListener('fframes-test-progress',event=>{readout.textContent=`Testing ${event.detail.completed}/${event.detail.total}`});downloadButton.onclick=()=>window.fframesTests.download();
</script></body></html>
